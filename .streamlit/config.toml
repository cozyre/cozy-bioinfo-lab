# Theme for the TP53 Conservation Analyzer.
# Neutrals + Okabe-Ito primary (#0072B2) keep data-dense tables readable.
[theme]
base = "light"
primaryColor = "#0072B2"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#E9EEF6"
textColor = "#1E3A8A"
# System fallbacks keep the UI legible when the webfonts cannot be fetched.
font = "Fira Sans:https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&display=swap, sans-serif"
codeFont = "Fira Code:https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&display=swap, monospace"

[server]
# Uploads are validated in the app; this matches config.MAX_UPLOAD_BYTES (5 MiB).
maxUploadSize = 5
